<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LendLocal — Shared expenses, made clear</title>
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    // Bounce authed users to dashboard; others to login landing
    (function () {
      if (localStorage.getItem('lendlocal_token')) {
        location.replace('/dashboard.html');
      } else {
        location.replace('/login.html');
      }
    })();
  </script>
</head>
<body>
  <p style="padding:2rem;font-family:sans-serif;text-align:center;">Loading LendLocal…</p>
  <script src="/js/pwa.js"></script>
</body>
</html>

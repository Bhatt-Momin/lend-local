<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LendLocal — Shared expenses, made clear</title>
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030507">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/helpers.js"></script>
  <script>
    // Bounce authed users to destination/dashboard; others to login landing
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const nextUrl = urlParams.get('next');

      let destination = '/dashboard.html';
      if (nextUrl) {
        destination = parseReturnUrl(nextUrl, window.location.origin);
      }

      if (localStorage.getItem('lendlocal_token')) {
        location.replace(destination);
      } else {
        if (destination !== '/dashboard.html') {
          location.replace('/login.html?next=' + encodeURIComponent(destination));
        } else {
          location.replace('/login.html');
        }
      }
    })();
  </script>
</head>
<body>
  <p style="padding:2rem;font-family:sans-serif;text-align:center;">Loading LendLocal…</p>
  <script src="/js/pwa.js"></script>
</body>
</html>

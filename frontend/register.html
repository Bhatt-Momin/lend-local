<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — LendLocal</title>

  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/animations.css">
</head>

<body>
  <div class="page auth-shell">
    <section class="auth-hero" aria-label="Brand">
      <div>
        <p class="brand-mark">LendLocal</p>
        <p>A simple ledger for student groups — rent, trips, dinners, and everything in between.</p>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h1>Create account</h1>
        <p class="lede">Join LendLocal and start splitting fairly.</p>
        <div id="alert" class="alert alert-error" role="alert"></div>
        <form id="registerForm" class="form-stack">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required placeholder="Your name"
              maxlength="80" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
              placeholder="At least 6 characters" minlength="6" />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
      </div>
    </section>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script>
    redirectIfAuthed();
  
    const form = document.getElementById('registerForm');
    const alertEl = document.getElementById('alert');
    const submitBtn = form.querySelector('button[type="submit"]');
  
    function showValidationError(message) {
      showAlert(alertEl, message);
  
      if (window.FX) {
        window.FX.shake(alertEl);
      }
    }
  
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      hideAlert(alertEl);
  
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
  
      // Name validation
      if (name.length < 2) {
        showValidationError('Name must be at least 2 characters.');
        return;
      }
  
      if (!/^[A-Za-z ]+$/.test(name)) {
        showValidationError('Name can contain only letters and spaces.');
        return;
      }
  
      // Email validation
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showValidationError('Please enter a valid email address.');
        return;
      }
  
      // Password validation
      if (password.length < 8) {
        showValidationError('Password must be at least 8 characters.');
        return;
      }
  
      if (!/[A-Z]/.test(password)) {
        showValidationError(
          'Password must contain at least one uppercase letter.'
        );
        return;
      }
  
      if (!/[a-z]/.test(password)) {
        showValidationError(
          'Password must contain at least one lowercase letter.'
        );
        return;
      }
  
      if (!/[0-9]/.test(password)) {
        showValidationError(
          'Password must contain at least one number.'
        );
        return;
      }
  
      // Prevent duplicate registration requests
      submitBtn.disabled = true;
      submitBtn.dataset.originalText = submitBtn.textContent;
  
      submitBtn.innerHTML = `
        <span class="fx-spinner"></span>
        Creating account...
      `;
  
      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name,
            email,
            password,
          }),
        });
  
        setSession(data.token, data.user);
  
        if (window.FX) {
          window.FX.toast('Account created successfully!');
        }
  
        // Briefly show success feedback before redirecting
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);
  
      } catch (err) {
        showAlert(alertEl, err.message);
  
        if (window.FX) {
          window.FX.shake(alertEl);
        }
  
        // Restore button after failed registration
        submitBtn.disabled = false;
        submitBtn.textContent =
          submitBtn.dataset.originalText || 'Register';
      }
    });
  </script>
</body>

</html>
